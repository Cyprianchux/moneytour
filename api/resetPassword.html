<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoneyTour | Reset Password</title>
  <link rel="icon" href="media/moneytour_fav.png" type="image/png" sizes="512x512">
  <meta name="description" content="Reset your MoneyTour password">
  <link rel="stylesheet" href="styles/index.css" />
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
  <div class="container-header">
    <div class="logo">
      <a href="index.html"><img src="media/MoneyTour.png" alt="MoneyTour Logo"/></a>
    </div>
    <h1 class="header1">
      <a href="index.html">MoneyTour</a>
    </h1>
  </div>

  <main>
    <div id="container-login">
      <div id="title">Reset Password</div>
      <form id="resetForm">
        <small>
          An OTP has been sent to <span id="email" style="font-weight: bold; color: var(--purple);"></span>. Please check your inbox (or spam folder).
        </small>
        <div class="input">
          <input type="text" id="otp" placeholder="Enter OTP code" maxlength="6" required />
        </div>
        <div class="input">
          <input type="password" id="password" placeholder="Enter new password" required />
        </div>
        <div class="input">
          <input type="password" id="confirmPassword" placeholder="Confirm new password" required />
        </div>

        <button type="submit">Reset Password</button>
      </form>
      <p id="message"></p>
      
      <p class="resend">
        Didn't get the code? <button id="resendOtpBtn" type="button">Resend OTP</button>
      </p>
    </div>
  </main>

  <footer>
    &copy; 2024 MoneyTour
  </footer>

  <script src="scripts/resetPassword.js"></script>
</body>
</html>
