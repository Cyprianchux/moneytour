<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoneyTour | Transaction History</title>
    <link
      rel="icon"
      href="../media/moneytour_fav.png"
      type="image/png"
      sizes="512x512"
    />
    <meta name="description" content="View your transaction history" />
    <link rel="stylesheet" href="../styles/index.css" />
    <link rel="stylesheet" href="../styles/transHistory.css" />
    <link rel="stylesheet" href="../styles/mobile.css" />
    <style>
      body.auth-checking {
        visibility: hidden;
      }
    </style>
  </head>
  <body class="auth-checking">
    <header class="site-header">
      <div class="nav-wrap">
        <a class="brand" href="../index.html" aria-label="MoneyTour home">
          <img src="../media/MoneyTour.png" alt="" />
          <span>Money<span>Tour</span></span>
        </a>
        <nav
          class="top-nav history-top-nav"
          aria-label="Transaction history navigation"
        >
          <a class="nav-login" href="dashboard.html"> Add Transaction </a>
          <button
            class="button button-small"
            type="button"
            onclick="window.moneytourLogout()"
          >
            Logout
          </button>
        </nav>
      </div>
    </header>

    <main>
      <div class="transbalance">
        <p>Balance:</p>
        <span id="balance">₦0.00</span>
      </div>
      <div class="container-transaction">
        <h3 class="t-hist">Transaction History</h3>
        <table id="transactionTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Type</th>
              <th>Details</th>
              <th>Amount</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="transactionTableBody">
            <!-- Transactions will be inserted here -->
          </tbody>
        </table>
      </div>
    </main>

    <footer>&copy; 2024 MoneyTour</footer>

    <script src="../scripts/config.js"></script>
    <script src="../scripts/auth.js"></script>
    <script src="../scripts/transHistory.js"></script>
  </body>
</html>
